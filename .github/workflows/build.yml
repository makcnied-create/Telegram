name: Build Telegram with Tgnet Exporter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK and configure SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" || echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529"
          
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          echo "Using NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$NDK_DIR
          EOF

      - name: Create dummy google-services.json
        run: |
          cat > TMessagesProj/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "telegram-dummy",
              "storage_bucket": "telegram-dummy.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:0:android:0",
                "android_client_info": {
                  "package_name": "org.telegram.messenger"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "0"}],
              "services": {
                "appinvite_service": {"other_platform_oauth_client": []}
              }
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Apply tgnet.dat export patch
        run: |
          echo "=== 1. Creating TgnetExporter.java ==="
          mkdir -p TMessagesProj/src/main/java/org/telegram/messenger
          cat > TMessagesProj/src/main/java/org/telegram/messenger/TgnetExporter.java << 'EOF'
          package org.telegram.messenger;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Log;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class TgnetExporter {
              private static final String TAG = "TgnetExporter";
              private static boolean alreadyExported = false;

              public static void checkAndExport(final Activity activity) {
                  if (activity == null || activity.isFinishing()) {
                      return;
                  }

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              File filesDir = activity.getFilesDir();
                              File tgnetFile = new File(filesDir, "tgnet.dat");

                              if (!tgnetFile.exists() || tgnetFile.length() == 0) {
                                  File[] subFiles = filesDir.listFiles();
                                  if (subFiles != null) {
                                      for (File f : subFiles) {
                                          if (f.isDirectory() && f.getName().startsWith("account")) {
                                              File subTgnet = new File(f, "tgnet.dat");
                                              if (subTgnet.exists() && subTgnet.length() > 0) {
                                                  tgnetFile = subTgnet;
                                                  break;
                                              }
                                          }
                                      }
                                  }
                              }

                              if (!tgnetFile.exists() || tgnetFile.length() == 0) {
                                  return;
                              }

                              if (alreadyExported) {
                                  return;
                              }
                              alreadyExported = true;

                              File extDir = activity.getExternalFilesDir(null);
                              if (extDir != null) {
                                  copyFile(tgnetFile, new File(extDir, "tgnet.dat"));
                              }

                              File dataDir = new File(activity.getApplicationInfo().dataDir);
                              File userConfig = new File(dataDir, "shared_prefs/userconfig.xml");

                              saveToDownloads(activity, tgnetFile, "tgnet.dat");
                              if (userConfig.exists()) {
                                  saveToDownloads(activity, userConfig, "userconfig.xml");
                                  if (extDir != null) {
                                      copyFile(userConfig, new File(extDir, "userconfig.xml"));
                                  }
                              }

                              final File finalTgnet = tgnetFile;
                              new Handler(Looper.getMainLooper()).post(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (activity.isFinishing()) return;

                                      Toast.makeText(activity, "tgnet.dat сохранён в папку Downloads!", Toast.LENGTH_LONG).show();

                                      new AlertDialog.Builder(activity)
                                          .setTitle("Экспорт сессии Telegram")
                                          .setMessage("Файлы tgnet.dat и userconfig.xml успешно сохранены в папку Загрузки (Downloads)!\n\nХотите отправить tgnet.dat прямо сейчас (в Избранное, Telegram, Диск или по почте)?")
                                          .setPositiveButton("Поделиться", new DialogInterface.OnClickListener() {
                                              @Override
                                              public void onClick(DialogInterface dialog, int which) {
                                                  shareFile(activity, finalTgnet);
                                              }
                                          })
                                          .setNegativeButton("Готово", null)
                                          .show();
                                  }
                              });

                          } catch (Exception e) {
                              Log.e(TAG, "Export error", e);
                          }
                      }
                  }).start();
              }

              private static void copyFile(File src, File dst) {
                  try (InputStream in = new FileInputStream(src);
                       OutputStream out = new FileOutputStream(dst)) {
                      byte[] buf = new byte[8192];
                      int len;
                      while ((len = in.read(buf)) > 0) {
                          out.write(buf, 0, len);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "copyFile error", e);
                  }
              }

              private static void saveToDownloads(Context context, File sourceFile, String displayName) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, displayName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream");
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = context.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              try (InputStream in = new FileInputStream(sourceFile);
                                   OutputStream out = context.getContentResolver().openOutputStream(uri)) {
                                  byte[] buf = new byte[8192];
                                  int len;
                                  while ((len = in.read(buf)) > 0) {
                                      out.write(buf, 0, len);
                                  }
                              }
                          }
                      } else {
                          File dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (dlDir != null && (dlDir.exists() || dlDir.mkdirs())) {
                              File dst = new File(dlDir, displayName);
                              copyFile(sourceFile, dst);
                          }
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "saveToDownloads error", e);
                  }
              }

              public static void shareFile(Activity activity, File file) {
                  try {
                      File cacheDir = new File(activity.getCacheDir(), "exports");
                      cacheDir.mkdirs();
                      File cacheFile = new File(cacheDir, file.getName());
                      copyFile(file, cacheFile);

                      Uri uri = FileProvider.getUriForFile(
                          activity,
                          activity.getPackageName() + ".provider",
                          cacheFile
                      );

                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType("application/octet-stream");
                      intent.putExtra(Intent.EXTRA_STREAM, uri);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      activity.startActivity(Intent.createChooser(intent, "Сохранить / Отправить " + file.getName()));
                  } catch (Exception e) {
                      Toast.makeText(activity, "Ошибка при отправке: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      Log.e(TAG, "shareFile error", e);
                  }
              }
          }
          EOF

          echo "=== 2. Injecting hook into LaunchActivity.java ==="
          python3 -c "
          path = 'TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          target = 'ApplicationLoader.mainInterfacePaused = false;'
          injection = 'org.telegram.messenger.TgnetExporter.checkAndExport(this);\n        ApplicationLoader.mainInterfacePaused = false;'

          if target in content:
              content = content.replace(target, injection, 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('SUCCESS: LaunchActivity.java hooked successfully!')
          else:
              print('WARNING: target string not found!')
              exit(1)
          "

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleAfatDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-tgnet-export-debug
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 7
